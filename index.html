<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ukubona · Watch</title>

<!-- Favicon: classical pentagram, {5/2}, all five diagonals connected -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%2308080D'/%3E%3Cpolygon points='50,10 74.3,84.8 10.6,38.6 89.4,38.6 25.7,84.8' fill='none' stroke='%23F59E0B' stroke-width='6' stroke-linejoin='round'/%3E%3C/svg%3E">

<style>
:root {
  --bg: #08080D; --surface: #0F0F18; --surface2: #16161F; --border: #24243A;
  --amber: #F59E0B; --text: #E8E8F0; --muted: #8A8AB0;
  --serif: 'Iowan Old Style', Georgia, serif;
  --sans: system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, monospace;
}
:root[data-theme="light"] {
  --bg: #F2F0EA; --surface: #FFFFFF; --surface2: #EDEAE2; --border: rgba(0,0,0,.12);
  --amber: #92610A; --text: #18160F; --muted: #6B6555;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.6; min-height: 100vh; transition: background .3s, color .3s; }

/* ── top bar ── */
.bar { position: sticky; top: 0; z-index: 50; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 1.25rem; background: var(--bg); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: .7rem; color: var(--text); text-decoration: none; }
.logo { width: 30px; height: 30px; flex-shrink: 0; animation: spin 24s linear infinite; }
.logo polygon { fill: none; stroke: var(--amber); stroke-width: 5; stroke-linejoin: round; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .logo { animation: none; } html { scroll-behavior: auto; } }
.brand span { font-family: var(--serif); font-size: 1.05rem; letter-spacing: .02em; }
.tools { display: flex; align-items: center; gap: .5rem; position: relative; }
.btn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; transition: border-color .2s; }
.btn:hover, .btn[aria-expanded="true"] { border-color: var(--amber); }
.btn:focus-visible, .tile:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.btn svg { width: 18px; height: 18px; }
.sun { display: none; }
:root[data-theme="light"] .sun { display: block; }
:root[data-theme="light"] .moon { display: none; }

/* ── app waffle ── */
.waffle-dots { display: grid; grid-template-columns: repeat(3, 4px); gap: 3px; }
.waffle-dots i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; }
.panel { position: absolute; top: 46px; right: 0; width: 264px; padding: .8rem; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.35); display: none; grid-template-columns: repeat(3, 1fr); gap: .4rem; }
.panel.open { display: grid; }
.tile { display: flex; flex-direction: column; align-items: center; gap: .3rem; padding: .7rem .3rem; border-radius: 8px; color: var(--text); text-decoration: none; font-size: .74rem; text-align: center; }
.tile:hover { background: var(--surface2); }
.tile .ic { font-size: 1.3rem; line-height: 1; color: var(--amber); }
.tile.soon { opacity: .45; pointer-events: none; }

/* ── content ── */
main { max-width: 1000px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
section { margin-bottom: 3rem; }
h1 { font-family: var(--serif); font-weight: 400; font-size: 1.8rem; margin-bottom: 1rem; }
.eyebrow { font-family: var(--mono); font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: .4rem; }
.frame { display: flex; justify-content: center; }
.frame iframe { width: 75%; height: 500px; border: 1px solid var(--border); border-radius: 6px; background: #000; }
@media (max-width: 720px) { .frame iframe { width: 100%; height: 56vw; min-height: 220px; } }
.placeholder { padding: 1.2rem; border: 1px dashed var(--border); border-radius: 8px; color: var(--muted); font-size: .9rem; }
footer { text-align: center; padding: 1.5rem; border-top: 1px solid var(--border); font-family: var(--mono); font-size: .68rem; color: var(--muted); }
</style>
</head>
<body>

<header class="bar">
  <a class="brand" href="#top" aria-label="Ukubona, top of page">
    <!-- Rotating logo: the same pentagram as the favicon -->
    <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
      <polygon points="50,4 77.04,87.21 6.25,35.78 93.75,35.78 22.96,87.21"/>
    </svg>
    <span>Ukubona</span>
  </a>

  <div class="tools">
    <button class="btn" id="theme" type="button" aria-label="Toggle light and dark theme">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="btn" id="waffle" type="button" aria-label="Parts of this page" aria-haspopup="true" aria-expanded="false" aria-controls="panel">
      <span class="waffle-dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
    </button>
    <nav class="panel" id="panel" aria-label="Parts of this page"></nav>
  </div>
</header>

<main id="top">
  <section id="watch">
    <div class="eyebrow">Part 1 · Watch</div>
    <h1>The video</h1>
    <div class="frame">
      <iframe
        src="https://www.youtube.com/embed/qhJ6wRz_Kj4"
        title="YouTube video player"
        width="75%"
        height="500"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen></iframe>
    </div>
  </section>

  <section id="notes">
    <div class="eyebrow">Part 2 · Notes</div>
    <h1>Notes</h1>
    <div class="placeholder">Reserved for the reading of the video. Add a part by adding one line to <code>PARTS</code> in the script and one <code>&lt;section id="…"&gt;</code> here.</div>
  </section>
</main>

<footer>Ukubona LLC · “Ukubona” means to see, to witness</footer>

<script>
/* Add parts here: the waffle is built from this list. `id` must match a <section id>. */
const PARTS = [
  { id: "watch", label: "Watch", icon: "▶" },
  { id: "notes", label: "Notes", icon: "✎" },
  { id: "soon",  label: "More soon", icon: "＋", soon: true },
]

const root = document.documentElement
const panel = document.getElementById("panel")
const waffleBtn = document.getElementById("waffle")

/* ── theme: saved choice, else the system setting ── */
let saved = null
try { saved = localStorage.getItem("ukb-theme") } catch (e) {}
root.setAttribute("data-theme", saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"))
document.getElementById("theme").addEventListener("click", () => {
  const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark"
  root.setAttribute("data-theme", next)
  try { localStorage.setItem("ukb-theme", next) } catch (e) {}
})

/* ── waffle ── */
panel.innerHTML = PARTS.map(p =>
  `<a class="tile${p.soon ? " soon" : ""}" href="#${p.id}"${p.soon ? ' tabindex="-1" aria-disabled="true"' : ""}><span class="ic" aria-hidden="true">${p.icon}</span>${p.label}</a>`
).join("")

const setOpen = (open) => {
  panel.classList.toggle("open", open)
  waffleBtn.setAttribute("aria-expanded", String(open))
}
waffleBtn.addEventListener("click", (e) => { e.stopPropagation(); setOpen(!panel.classList.contains("open")) })
panel.addEventListener("click", () => setOpen(false))
document.addEventListener("click", () => setOpen(false))
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { setOpen(false); waffleBtn.focus() } })
</script>
</body>
</html>
